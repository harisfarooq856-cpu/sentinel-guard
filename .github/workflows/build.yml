name: Build & Release Sentinel Guard

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (.NET 8 WPF)
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SentinelGuard.csproj

      - name: Build Solution
        run: dotnet build SentinelGuard.csproj -c Release --no-restore

      - name: Publish Single-File Executable
        run: dotnet publish SentinelGuard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Archive Release Package
        run: |
          Compress-Archive -Path publish\* -DestinationPath SentinelGuard-win-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelGuard-win-x64
          path: SentinelGuard-win-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SentinelGuard-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
